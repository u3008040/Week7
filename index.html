<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 7 · Quality Engineering</title>
<meta name="description" content="INE 315 Week 7: control charts with pandas, p charts and capability, one step at a time.">
<style>
:root{
  --bg:#f7f6f3; --panel:#ffffff; --panel-2:#f2f0ec; --line:#e2dfd9; --line-soft:#ecE9e4;
  --ink:#1f1d1a; --ink-2:#4f4a44; --ink-3:#86807a;
  --red:#A93226; --red-soft:rgba(169,50,38,.09); --blue:#2874A6; --blue-soft:rgba(40,116,166,.10);
  --ok:#1e7a4b; --ok-soft:rgba(30,122,75,.10); --bad:#b0382a; --bad-soft:rgba(176,56,42,.09);
  --code-bg:#fbfaf8; --hl:#fff0c2; --hl-edge:#d8a200;
  --kw:#8e3a88; --str:#2a7a3a; --com:#8f887f; --num:#a14a10; --fn:#2874A6;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141618; --panel:#1c1f22; --panel-2:#23272b; --line:#33383d; --line-soft:#2a2e33;
    --ink:#ece8e3; --ink-2:#b9b2aa; --ink-3:#877f77;
    --red:#D0655A; --red-soft:rgba(208,101,90,.14); --blue:#5BA3D6; --blue-soft:rgba(91,163,214,.14);
    --ok:#5cbf8d; --ok-soft:rgba(92,191,141,.13); --bad:#e0867a; --bad-soft:rgba(224,134,122,.13);
    --code-bg:#17191c; --hl:#3a3218; --hl-edge:#d8a200;
    --kw:#d59ad0; --str:#94d29a; --com:#7f786f; --num:#eaa872; --fn:#7dbbe6; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141618; --panel:#1c1f22; --panel-2:#23272b; --line:#33383d; --line-soft:#2a2e33;
  --ink:#ece8e3; --ink-2:#b9b2aa; --ink-3:#877f77;
  --red:#D0655A; --red-soft:rgba(208,101,90,.14); --blue:#5BA3D6; --blue-soft:rgba(91,163,214,.14);
  --ok:#5cbf8d; --ok-soft:rgba(92,191,141,.13); --bad:#e0867a; --bad-soft:rgba(224,134,122,.13);
  --code-bg:#17191c; --hl:#3a3218; --hl-edge:#d8a200;
  --kw:#d59ad0; --str:#94d29a; --com:#7f786f; --num:#eaa872; --fn:#7dbbe6; --shadow:none;
}
*{box-sizing:border-box}
html{font-size:18px; -webkit-text-size-adjust:100%}
@media (max-width:700px){ html{font-size:16px} }
body{margin:0; background:var(--bg); color:var(--ink); font:1rem/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; display:flex; flex-direction:column}
button{font:inherit; color:inherit}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
p code, li code, td code, .task code, .note code, .cause code, .mist code, .why code, .notebox code{font-size:.9em; background:var(--panel-2); border:1px solid var(--line-soft); border-radius:5px; padding:0 .28em}
kbd{font-family:inherit; font-size:.82em; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 .35em; background:var(--panel)}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px}

/* top bar */
.top{position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:1px solid var(--line)}
.top .in{max-width:1200px; margin:0 auto; padding:8px 16px; display:flex; gap:12px; align-items:center}
.brand{font-weight:700; font-size:.9rem; white-space:nowrap}
.brand span{color:var(--red)}
.chips{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line); background:var(--panel); border-radius:99px; padding:3px 9px; font-size:.78rem; cursor:pointer; white-space:nowrap; color:var(--ink-2)}
.chip b{color:var(--red); margin-right:3px}
.chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip.on b{color:inherit}
.chip.done{border-color:var(--ok)}
.tools{display:flex; gap:6px; align-items:center; flex:none}
.chips .chip{font-size:.74rem}
.tbtn{border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:4px 10px; font-size:.78rem; cursor:pointer; color:var(--ink-2); white-space:nowrap; text-decoration:none}
.tbtn.colab{background:var(--blue); color:#fff; border-color:var(--blue)}
.timer{font-variant-numeric:tabular-nums; font-weight:700; font-size:.9rem; padding:3px 10px; border-radius:8px; background:var(--blue-soft); color:var(--blue); cursor:pointer; display:none}
.timer.on{display:inline-block}
.timer.up{background:var(--red); color:#fff; animation:pulse 1s ease 3}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (max-width:700px){ .brand{display:none} }

/* stage */
main{flex:1; width:100%; max-width:1200px; margin:0 auto; padding:22px 16px 110px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:26px 28px; min-height:62vh; animation:fade .25s ease}
@keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){ .card{animation:none} }
@media (max-width:700px){ .card{padding:18px 16px} }
.ctype{display:inline-flex; align-items:center; gap:8px; font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin-bottom:6px}
.ctype .pill{background:var(--red); color:#fff; border-radius:99px; padding:2px 10px; letter-spacing:.06em}
.ctype .pill.blue{background:var(--blue)} .ctype .pill.green{background:var(--ok)} .ctype .pill.gray{background:var(--ink-3)}
h1{font-size:clamp(1.5rem,3.4vw,2.2rem); line-height:1.15; margin:0 0 6px; letter-spacing:-.01em}
h2{font-size:clamp(1.25rem,2.6vw,1.65rem); line-height:1.2; margin:0 0 6px}
h3{font-size:1.02rem; margin:0 0 8px}
.lead{color:var(--ink-2); margin:0 0 18px; max-width:70ch}
.goal{display:inline-block; background:var(--ok-soft); color:var(--ink); border-radius:9px; padding:5px 12px; font-size:.9rem; margin:4px 0 16px}
.goal b{color:var(--ok)}
.given{border:1px solid var(--line); border-left:4px solid var(--ink-3); background:var(--panel-2); border-radius:10px; padding:10px 14px; margin:0 0 16px; font-size:.92rem}
.given .tag{font-size:.68rem; font-weight:700; letter-spacing:.08em; color:var(--ink-3); text-transform:uppercase; display:block}
.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; align-items:start}
.two.wide-left{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:860px){ .two,.two.wide-left{grid-template-columns:minmax(0,1fr)} }
.points{margin:0; padding:0; list-style:none; display:grid; gap:12px}
.points li{position:relative; padding-left:30px; font-size:1.06rem}
.points li::before{content:counter(p); counter-increment:p; position:absolute; left:0; top:.1em; width:21px; height:21px; border-radius:50%; background:var(--red-soft); color:var(--red); font-size:.75rem; font-weight:700; display:grid; place-items:center}
.points{counter-reset:p}

/* code */
.code{margin:0; background:var(--code-bg); border:1px solid var(--line); border-radius:12px; padding:12px 0; font-size:.9rem; line-height:1.65; overflow-x:auto}
.code.big{font-size:1rem}
.code .ln{display:block; padding:0 16px 0 0; white-space:pre; border-left:4px solid transparent}
.code .ln .no{display:inline-block; width:2.4em; text-align:right; padding-right:1em; color:var(--ink-3); user-select:none}
.code .ln.cur{background:var(--hl); border-left-color:var(--hl-edge)}
.code .ln.cur .no{color:var(--ink); font-weight:700}
.code .ln.click{cursor:pointer}
.code .ln.click:hover{background:var(--panel-2)}
.code .ln.right{background:var(--ok-soft); border-left-color:var(--ok)}
.code .ln.wrong{background:var(--bad-soft); border-left-color:var(--bad)}
.code .ln.cause{background:var(--blue-soft); border-left-color:var(--blue)}
.tk-kw{color:var(--kw); font-weight:600} .tk-str{color:var(--str)} .tk-com{color:var(--com); font-style:italic} .tk-num{color:var(--num)} .tk-fn{color:var(--fn)}
.out{margin:0; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.9rem; white-space:pre; overflow-x:auto; min-height:2.6em}
.out.empty{color:var(--ink-3); font-style:italic; font-family:inherit}
.cap{font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin:14px 0 5px}
.cap:first-child{margin-top:0}

/* visuals */
.vis{margin-top:16px}
.boxes{display:flex; gap:14px; flex-wrap:wrap}
.vbox{text-align:center}
.vbox .nm{font-family:ui-monospace,monospace; font-size:.85rem; color:var(--ink-2)}
.vbox .val{border:2px solid var(--ink); border-radius:10px; padding:8px 16px; font-family:ui-monospace,monospace; font-weight:700; margin:4px 0; background:var(--panel)}
.vbox .ty{font-size:.72rem; color:var(--ink-3)}
.lst{display:flex; gap:0}
.lst .cell{text-align:center}
.lst .ix{font-size:.72rem; color:var(--ink-3); font-family:ui-monospace,monospace}
.lst .v{border:2px solid var(--ink); border-right-width:0; padding:8px 12px; font-family:ui-monospace,monospace; font-weight:700; min-width:3.4em; background:var(--panel)}
.lst .cell:last-child .v{border-right-width:2px; border-radius:0 8px 8px 0}
.lst .cell:first-child .v{border-radius:8px 0 0 8px}
.dtab{border-collapse:collapse; font-family:ui-monospace,monospace}
.dtab td{border:2px solid var(--ink); padding:6px 14px; background:var(--panel)}
.dtab td:first-child{background:var(--panel-2); color:var(--ink-2)}
.dtab .arr{border:0; background:transparent; color:var(--ink-3); padding:0 6px}
.machine{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-family:ui-monospace,monospace}
.machine .in, .machine .res{border:1px dashed var(--ink-3); border-radius:8px; padding:6px 10px; font-size:.85rem}
.machine .box{border:2px solid var(--blue); background:var(--blue-soft); border-radius:12px; padding:12px 16px; font-weight:700; color:var(--blue)}
.machine .res{border-style:solid; border-color:var(--ok); color:var(--ok); font-weight:700}
.machine .ar{color:var(--ink-3); font-size:1.3rem}
.bp{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.bp .cls{border:2px dashed var(--blue); border-radius:12px; padding:10px 14px; color:var(--blue); font-family:ui-monospace,monospace; font-size:.85rem}
.bp .obj{border:2px solid var(--ink); border-radius:12px; padding:8px 12px; font-family:ui-monospace,monospace; font-size:.85rem; background:var(--panel)}
.bp .obj b{display:block; font-family:inherit; margin-bottom:2px}
.chainv{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.chainv .node{border:2px solid var(--ink); border-radius:12px; padding:8px 14px; font-weight:700; background:var(--panel)}
.chainv .node.c{border-style:dashed; font-weight:500}
.chainv .ar{display:flex; flex-direction:column; align-items:center; font-size:.72rem; color:var(--red); font-family:ui-monospace,monospace}
.chainv .ar span:last-child{font-size:1.2rem; line-height:1}
.colabv{border:1px solid var(--line); border-radius:12px; overflow:hidden; font-family:ui-monospace,monospace; font-size:.85rem}
.colabv .row{display:flex; gap:10px; padding:10px 12px; background:var(--code-bg); align-items:center}
.colabv .play{width:26px; height:26px; border-radius:50%; background:var(--ink); color:var(--bg); display:grid; place-items:center; font-size:.7rem; flex:none}
.colabv .o{padding:8px 12px 8px 48px; border-top:1px solid var(--line); background:var(--panel)}
.indentv .ln.band{background:var(--blue-soft)}
.bandnote{font-size:.8rem; color:var(--blue); margin-top:6px}

/* predict */
.opts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:6px}
@media (max-width:560px){ .opts{grid-template-columns:minmax(0,1fr)} }
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:10px 14px; cursor:pointer}
.opt:hover{background:var(--panel-2)}
.opt .l{flex:none; width:26px; height:26px; border-radius:50%; background:var(--panel-2); display:grid; place-items:center; font-weight:700; font-size:.85rem}
.opt pre{margin:0; font-family:ui-monospace,monospace; font-size:.9rem; white-space:pre-wrap}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .l{background:var(--ok); color:#fff}
.opt.dim{opacity:.45}
.ask{font-size:.92rem; color:var(--ink-2); margin:10px 0 0}
.btn{border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:8px 16px; cursor:pointer; font-weight:600; font-size:.92rem}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--red); border-color:var(--red); color:#fff}
.btn.blue{background:var(--blue); border-color:var(--blue); color:#fff}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.sm{padding:4px 10px; font-size:.82rem}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.reveal{display:none; margin-top:14px}
.reveal.show{display:block; animation:fade .25s ease}

/* trace */
.note{background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--hl-edge); border-radius:10px; padding:10px 14px; font-size:1.02rem; min-height:3.2em}
.vars{width:100%; border-collapse:collapse; font-size:.88rem}
.vars td{border-bottom:1px solid var(--line-soft); padding:5px 8px; vertical-align:top}
.vars td:first-child{font-family:ui-monospace,monospace; color:var(--ink-2); width:34%; white-space:nowrap}
.vars td:last-child{font-family:ui-monospace,monospace; font-weight:600; word-break:break-word}
.vars tr.chg td{background:var(--hl)}
.frame{border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:8px}
.frame .fh{font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:5px 8px; background:var(--panel-2); color:var(--ink-3)}
.frame.fn{border-color:var(--blue)}
.frame.fn .fh{background:var(--blue-soft); color:var(--blue)}
.objt{border:1px solid var(--line); border-radius:8px; padding:3px 8px; display:inline-block; background:var(--panel)}
.objt .cn{font-size:.72rem; color:var(--ink-3); font-weight:700}
.objt div{font-weight:600}
.variant{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap}
.variant button{border:1px solid var(--line); background:var(--panel); border-radius:99px; padding:3px 12px; cursor:pointer; font-size:.85rem; font-family:ui-monospace,monospace}
.variant button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.stepinfo{font-size:.8rem; color:var(--ink-3)}

/* puzzle */
.pz{display:grid; gap:6px; margin-top:6px; overflow-x:auto}
.pzl{display:flex; align-items:center; gap:8px}
.pzl .ctl{display:flex; gap:4px; flex:none}
.pzl .ctl button{width:34px; height:30px; border:1px solid var(--line); background:var(--panel); border-radius:7px; cursor:pointer; font-weight:700}
.pzl .ctl button:hover{background:var(--panel-2)}
.pzl .txt{flex:1; min-width:0; font-family:ui-monospace,monospace; font-size:.95rem; background:var(--code-bg); border:1px solid var(--line); border-radius:8px; padding:6px 10px; white-space:pre; overflow-x:auto;
  background-image:repeating-linear-gradient(90deg, transparent 0, transparent calc(4ch - 1px), var(--line) calc(4ch - 1px), var(--line) 4ch); background-size:12ch 100%; background-position:10px 0; background-repeat:no-repeat}
.pzl .mark{width:22px; flex:none; font-weight:700; text-align:center}
.pzl.ok .txt{border-color:var(--ok); background-color:var(--ok-soft)}
.pzl.no .txt{border-color:var(--bad); background-color:var(--bad-soft)}
.pzl.ok .mark{color:var(--ok)} .pzl.no .mark{color:var(--bad)}
.fb{margin-top:10px; font-size:.95rem}

/* error */
.errline{margin-top:12px; background:var(--bad-soft); border:1px solid var(--bad); border-radius:10px; padding:10px 14px; font-family:ui-monospace,monospace; font-size:.9rem}
.errline b{color:var(--bad)}
.cause{margin-top:12px; background:var(--blue-soft); border-radius:10px; padding:10px 14px}

/* exercises */
.exlist{display:grid; grid-template-columns:minmax(0,1fr); gap:10px}
.ex{border:1px solid var(--line); border-radius:12px; padding:12px 16px; background:var(--panel); min-width:0}
.ex .h{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.ex .id{font-weight:800; color:var(--red); font-variant-numeric:tabular-nums}
.kind{font-size:.7rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; border-radius:6px; padding:1px 7px}
.kind.fill{background:var(--blue-soft); color:var(--blue)} .kind.fix{background:var(--bad-soft); color:var(--bad)} .kind.write{background:var(--ok-soft); color:var(--ok)}
.star{font-size:.72rem; color:var(--ink-3); border:1px solid var(--line); border-radius:6px; padding:0 6px}
.ex .task{margin:6px 0 4px; font-size:.95rem; color:var(--ink-2)}
.ex .see{font-size:.85rem; color:var(--ink-3)}
.ex .see code{font-size:.92em}
.ex.solved{border-color:var(--ok)}
.mist{margin-top:8px; font-size:.9rem; background:var(--panel-2); border-radius:8px; padding:8px 12px}
.mist b{color:var(--red)}
.chatbar{margin-top:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--panel-2); border-radius:12px; padding:10px 14px; font-size:.95rem}
.rhythm{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin:16px 0}
@media (max-width:700px){ .rhythm{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.rh{border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--panel)}
.rh .t{font-weight:700} .rh .d{font-size:.82rem; color:var(--ink-2)}
.rh .k{font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--red)}
.etab{width:100%; border-collapse:collapse; font-size:.92rem}
.etab th{text-align:left; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); padding:6px 8px; border-bottom:1px solid var(--line)}
.etab td{padding:8px; border-bottom:1px solid var(--line-soft); vertical-align:top}
.etab td:first-child{font-family:ui-monospace,monospace; font-weight:700; color:var(--bad); white-space:nowrap}

/* bottom bar */
.bottom{position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--panel); border-top:1px solid var(--line)}
.bottom .in{max-width:1200px; margin:0 auto; padding:10px 16px; display:flex; gap:12px; align-items:center}
.bottom .where{flex:1; min-width:0; text-align:center; font-size:.85rem; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.prog{position:absolute; left:0; top:-3px; height:3px; background:var(--red); transition:width .3s}
.navbtn{border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:8px 18px; cursor:pointer; font-weight:700}
.navbtn.next{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.navbtn:disabled{opacity:.35; cursor:not-allowed}

/* ---- week 6 additions ---- */
.chip.sep{cursor:default; border-style:dashed; color:var(--ink-3); font-weight:700; background:transparent}
.session{min-height:62vh; display:flex; flex-direction:column; justify-content:center}
.banner{display:inline-block; font-size:.8rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; background:var(--red); color:#fff; border-radius:99px; padding:4px 14px; margin-bottom:12px}
.banner.s2{background:var(--blue)}
.session h1{font-size:clamp(1.8rem,4.2vw,2.6rem)}
.recap{background:var(--panel-2); border-radius:12px; padding:12px 16px; margin:10px 0 16px; font-size:.95rem}
.demolist{display:grid; gap:8px; margin-top:6px}
.demolist div{border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:var(--panel)}
.tag{font-size:.68rem; font-weight:800; letter-spacing:.08em; border-radius:6px; padding:1px 7px; margin-left:6px; vertical-align:middle}
.tag.GIVEN,.tag.BACKGROUND{background:var(--panel-2); color:var(--ink-3); border:1px solid var(--line)}
.ftab{width:100%; border-collapse:collapse; font-size:.95rem; margin-top:10px}
.ftab td{padding:7px 10px; border-bottom:1px solid var(--line-soft); vertical-align:top}
.ftab td:first-child{width:46%}
.ftab td:last-child{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--blue); font-size:.9rem}
.ftab th{text-align:left; font-size:.7rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); padding:4px 10px; border-bottom:1px solid var(--line)}
.notebox{margin-top:14px; background:var(--panel-2); border-radius:10px; padding:10px 14px; font-size:.92rem}
svg.cc{display:block; width:100%; height:auto; touch-action:none; user-select:none}

nd: Weight'", "line": 2}, {"kind": "yourturn", "minutes": 10}, {"kind": "check"}], "exercises": [{"id": "5.1", "kind": "Write it", "title": "Load the file", "task": "Load <code>bottle_fill_machines.csv<\/code> into <code>df<\/code>, then print its shape and the list of machine names.", "solution": "df = pd.read_csv(\"bottle_fill_machines.csv\")\nprint(df.shape)\nprint(list(df[\"machine\"].unique()))", "see": "(300, 3) and ['M1', 'M2', 'M3']", "mistake": "Forgetting the quotes around the file name: without them Python looks for a variable called <code>bottle_fill_machines<\/code>.", "star": false, "output": "(300, 3)\n['M1', 'M2', 'M3']"}, {"id": "5.2", "kind": "Fill in", "title": "Keep one machine", "task": "Keep only the rows of machine <b>M2<\/b>. How many rows are left?", "solution": "d2 = df[df[\"machine\"] == \"M2\"]\nprint(len(d2))", "see": "100", "mistake": "Writing <code>\"m2\"<\/code>: text comparison is case-sensitive, so no row matches and the table is empty.", "star": false, "output": "100"}, {"id": "5.3", "kind": "Fill in", "title": "One row per subgroup", "task": "Build <code>stats2<\/code> for M2: group by subgroup, take the mean, min and max of <code>weight<\/code>, and add a <code>range<\/code> column.", "solution": "stats2 = d2.groupby(\"subgroup\")[\"weight\"].agg([\"mean\", \"min\", \"max\"])\nstats2[\"range\"] = stats2[\"max\"] - stats2[\"min\"]\nprint(stats2.head(3).round(2))", "see": "a table of 20 rows with columns mean, min, max, range", "mistake": "Grouping by <code>\"machine\"<\/code> instead of <code>\"subgroup\"<\/code>: one row instead of twenty.", "star": false, "output": "            mean    min    max  range\nsubgroup                             \n1         500.30  500.0  500.5    0.5\n2         500.44  500.1  500.8    0.7\n3         500.28  499.9  500.5    0.6"}, {"id": "5.4", "kind": "Write it", "title": "Both roads, one answer", "task": "Compute M2's mean of means and mean range <b>with pandas<\/b>, then get the same limits from y he returned dictionary, just like <code>stock[\"RAK\"] = 50<\/code> in the tutorial.", "<code>i + 1<\/code> turns positions into subgroup numbers for the report.", "<b>Do not pool the machines:<\/b> each machine is its own process, so each gets its own limits."], "output": "[8, 15, 16, 19] [13]"}, {"kind": "puzzle", "task": "Build the list <b>once<\/b>, add one row per machine, then make the table <b>after<\/b> the loop.", "lines": ["rows = []", "for machine, d in df.groupby(\"machine\"):", "res = analyse(d)", "rows.append({\"machine\": machine})", "summary = pd.DataFrame(rows)"], "levels": [0, 0, 1, 1, 0]}, {"kind": "demo", "title": "Loop over the machines", "code": "rows = []\nfor machine, d in df.groupby(\"machine\"):\n    res = analyse(d)\n    rows.append({\"machine\": machine,\n                 \"CL\":  round(res[\"X_CL\"], 3),\n                 \"UCL\": round(res[\"X_UCL\"], 3),\n                 \"LCL\": round(res[\"X_LCL\"], 3),\n                 \"rule1\": res[\"rule1\"],\n                 \"rule4\": res[\"rule4\"]})\nsummary = pd.DataFrame(rows)\nprint(summary)", "points": ["<code>rows<\/code> is the accumulator: one dictionary per machine.", "<code>pd.DataFrame(rows)<\/code> turns a list of dictionaries into a table, one row each.", "<b>M1, M2:<\/b> no signals. <b>M3:<\/b> Rule 4 from subgroup 13, and four points outside the limits."], "output": "  machine       CL      UCL      LCL            rule1 rule4\n0      M1  499.998  500.272  499.724               []    []\n1      M2  500.299  500.593  500.005               []    []\n2      M3  500.152  500.455  499.849  [8, 15, 16, 19]  [13]"}, {"kind": "predict", "question": "Move <code>rows = []<\/code> <i>inside<\/i> the loop. How many rows does the table have now?", "code": "for machine, d in df.groupby(\"machine\"):\n    rows = []                                  # moved inside!\n    res = analyse(d)\n    rows.append({\"machine\": machine, \"rule1\": res[\"rule1\"]})\nprint(len(pd.DataFrame(rows)))", "optio ds a different file name on each pass."]}, {"kind": "yourturn", "minutes": 12}, {"kind": "check"}, {"kind": "table", "title": "What is examinable from Session 1", "rows": [["<code>read_csv<\/code>, <code>head<\/code>, <code>shape<\/code>, selecting rows with a condition", "Cleaning raw production logs"], ["<code>groupby(col)[col].agg([...])<\/code>: say what it returns", "Normality tests, Q–Q plots"], ["Adding a column from two others", "Rational subgrouping"], ["<code>for key, g in df.groupby(...)<\/code> and <code>.tolist()<\/code>", "Why machines must not be pooled"], ["A list of dictionaries → <code>pd.DataFrame<\/code>", "Chart-type selection"], ["Reading a <code>KeyError<\/code> on a column name", ""]], "note": "<b>Next session:<\/b> two more small functions, a <b>p chart<\/b> and <b>capability<\/b>, and a three-line report for the three machines."}], "exercises": [{"id": "6.1", "kind": "Fill in", "title": "Complete analyse", "task": "Complete <code>analyse(d)<\/code>: two blanks, both calls to Week 6 functions.", "solution": "def analyse(d):\n    groups = [g[\"weight\"].tolist()\n              for _, g in d.groupby(\"subgroup\")]\n    lim = xbar_r_limits(groups)\n    xbars, ranges = subgroup_stats(groups)\n    r1 = rule1(xbars, lim[\"X_LCL\"], lim[\"X_UCL\"])\n    r4 = rule4(xbars, lim[\"X_CL\"])\n    lim[\"rule1\"] = [i + 1 for i in r1]\n    lim[\"rule4\"] = [i + 1 for i in r4]\n    return lim\n\nprint(analyse(df[df[\"machine\"] == \"M3\"])[\"rule4\"])      # [13]", "see": "[13]", "mistake": "Passing <code>d<\/code> (the DataFrame) to <code>xbar_r_limits<\/code>: it expects the list of lists <code>groups<\/code>.", "star": false, "output": "[13]"}, {"id": "6.2", "kind": "Write it", "title": "The machine loop", "task": "Run the loop over the machines and print <code>summary<\/code>. Then set <code>signal_machine<\/code> to the name of the machine with signals.", "solution": "rows = []\nfor machine, d in df.groupby(\"machine\"):\n    res = analyse(d)\n    rows.append({\"machine\": machine,\n                 \"CL\":  round(res[\"X_CL\"], 3),\n                 \"UCL\": round(res[\"X_UCL\"], 3),\n                 \"LCL\": round(res[\"X_LCL\"], 3),\n                 \"rule1\": res[\"rule1\"],\n                 \"rule4\": res[\"rule4\"]})\nsummary = pd.DataFrame(rows)\nprint(summary)\n\nsignal_machine = \"M3\"", "see": "a 3-row table; M3 has rule1 [8, 15, 16, 19] and rule4 [13]", "mistake": "<code>pd.DataFrame(row)<\/code> with the last dictionary only: one row instead of three.", "star": false, "output": "  machine       CL      UCL      LCL            rule1 rule4\n0      M1  499.998  500.272  499.724               []    []\n1      M2  500.299  500.593  500.005               []    []\n2      M3  500.152  500.455  499.849  [8, 15, 16, 19]  [13]"}, {"id": "6.3", "kind": "Fill in", "title": "Count the signals", "task": "Add a column <code>\"n_signals\"<\/code> to each row: the <b>number<\/b> of Rule 1 points.", "solution": "rows = []\nfor machine, d in df.groupby(\"machine\"):\n    res = analyse(d)\n    rows.append({\"machine\": machine,\n                 \"rule1\": res[\"rule1\"],\n                 \"n_signals\": len(res[\"rule1\"])})\nsummary3 = pd.DataFrame(rows)\nprint(summary3)", "see": "n_signals 0, 0 and 4", "mistake": "Writing <code>res[\"rule1\"]<\/code> without <code>len(...)<\/code>: that stores the list, not how many items it has.", "star": false, "output": "  machine            rule1  n_signals\n0      M1               []          0\n1      M2               []          0\n2      M3  [8, 15, 16, 19]          4"}, {"id": "6.4", "kind": "Predict", "title": "The accumulator inside the loop", "task": "In the loop below, <code>rows = []<\/code> has moved <b>inside<\/b> the <code>for<\/code>. <b>Predict<\/b> how many rows <code>summary<\/code> will have, then run.", "solution": "for machine, d in df.groupby(\"machine\"):\n    rows = []                                  # moved inside!\n    res = analyse(d)\n    rows.append({\"machine\": machine, \"rule1\": res[\"rule1\"]})\nsummary_bug = pd.DataFrame(rows)\n\nmy_prediction = 1         # the list is emptied on every pass: only M3 is left\nprint(summary_bug)", "see": "a 1-row table (M3 only)", "mistake": "Expecting 3. The accumulator is reset on every pass, the same bug as the tutorial's <code>total = 0<\/code> inside the loop.", "star": false, "output": "  machine            rule1\n0      M3  [8, 15, 16, 19]"}, {"id": "6.5", "kind": "Write it", "title": "One chart per machine", "task": "Save one X̄ chart per machine as <code>xbar_M1.png<\/code>, <code>xbar_M2.png<\/code>, <code>xbar_M3.png<\/code>, with the Rule 1 points in red.", "solution": "for machine, d in df.groupby(\"machine\"):\n    res = analyse(d)\n    groups = [g[\"weight\"].tolist() for _, g in d.groupby(\"subgroup\")]\n    xbars, ranges = subgroup_stats(groups)\n    sub = list(range(1, len(xbars) + 1))\n\n    fig, ax = plt.subplots()\n    ax.plot(sub, xbars, marker=\"o\")\n    for key in [\"X_CL\", \"X_UCL\", \"X_LCL\"]:\n        ax.axhline(res[key], linestyle=\"--\")\n    ax.scatter(res[\"rule1\"], [xbars[s - 1] for s in res[\"rule1\"]], color=\"red\", s=120)\n    ax.set_title(f\"Machine {machine}\")\n    fig.savefig(f\"xbar_{machine}.png\")\n    plt.show()", "see": "three charts, and three files", "mistake": "A fixed file name such as <code>\"xbar.png\"<\/code>: each pass overwrites the last, and only M3's chart survives.", "star": true}]}, {"session": 2, "id": "D1", "short": "Demo 7", "title": "Demo 7: a p chart in twelve lines", "notebook": "demo7_p_chart.ipynb", "cards": [{"kind": "idea", "tag": "BACKGROUND", "title": "The setting: pass/fail data, and control vs capability", "points": ["<b>Pass/fail data.<\/b> Each day a different number of circuit boards is inspected, and each board passes or fails. We chart the <b>proportion<\/b> that failed.", "<i>In control<\/i>: the process is stable (no signals). <i>Capable<\/i>: the stable process fits inside the customer's specification.", "Check control <b>first<\/b>; capability only makes sense for a stable process."], "note": "<b>None of this is examined.<\/b> It is here so the code has something to be about."}, {"kind": "idea", "tag": "GIVEN", "title": "The p chart formula", "points": ["Day <i>i<\/i>: inspect n<sub>i<\/sub> boards, find d<sub>i<\/sub> defective.", "Each day inspects a different number of boards, so each day has its <b>own<\/b> limits: UCL and LCL are <b>lists<\/b>.", "A proportion cannot be negative, so a negative LCL becomes 0."], "formulas": [["p<sub>i<\/sub> = d<sub>i<\/sub> / n<sub>i<\/sub>", "d / n"], ["p̄ = Σd<sub>i<\/sub> / Σn<sub>i<\/sub>", "sum(defectives) / sum(sizes)"], ["σ<sub>i<\/sub> = √( p̄(1 − p̄) / n<sub>i<\/sub> )", "(pbar * (1 - pbar) / n) ** 0.5"], ["UCL<sub>i<\/sub> = p̄ + 3σ<sub>i<\/sub>", "pbar + 3 * sigma"], ["LCL<sub>i<\/sub> = p̄ − 3σ<sub>i<\/sub>, but not below 0", "max(0.0, pbar - 3 * sigma)"]]}, {"kind": "live", "mode": "pbyhand", "title": "A p chart on three days, worked out by hand", "d": [8, 6, 9], "n": [200, 180, 220], "tasks": ["Push <b>day 1<\/b>'s n up to 300 and <b>day 2<\/b>'s down to 100. Which day now has the tightest limits, and does that make sense?", "Raise <b>day 2<\/b>'s defectives until the row turns red. How many does it take?", "Set all three n to the same number. What happens to the three UCLs &mdash; and why is that the only time a p chart looks like a Week 6 chart?"]}, {"kind": "live", "mode": "pytools", "title": "The seven commands p_chart is made of", "fn": "def p_chart(defectives, sizes):\n    pbar = sum(defectives) / sum(sizes)\n    p, ucl, lcl = [], [], []\n    for d, n in zip(defectives, sizes):\n        sigma = (pbar * (1 - pbar) / n) ** 0.5\n        p.append(d / n)\n        ucl.append(pbar + 3 * sigma)\n        lcl.append(max(0.0, pbar - 3 * sigma))\n    return pbar, p, ucl, lcl\n\npbar, p, ucl, lcl = p_chart(d, n)\nout = [i + 1 for i in range(len(p)) if p[i] > ucl[i] or p[i] < lcl[i]]", "cmds": [{"id": "sum return 3, [4, 5]\n\na, b = two()\nprint(a)\nprint(b)", "out": "3\n[4, 5]", "why": "<code>return pbar, p, ucl, lcl<\/code> hands back four things at once, and the call site catches them in four names. <b>Count the names on the left and the values on the right: they must match.<\/b>"}, {"id": "compr", "nm": "[i + 1 for i ... if ...]", "wh": "pick out the positions that break a rule", "lines": [12], "code": "p   = [0.04, 0.0333, 0.0409]\nucl = [0.0791, 0.0813, 0.0300]\nout = [i + 1 for i in range(len(p)) if p[i] > ucl[i]]\nprint(out)", "out": "[3]", "why": "The Week 6 <code>rule1<\/code> pattern, unchanged. <b>Compare position by position<\/b> (<code>p[i]<\/code> with <code>ucl[i]<\/code>), because each day has its own limit, and <code>+ 1<\/code> turns a position into a day number."}], "tasks": ["Tick <code>zip<\/code> and <code>append<\/code>. Those two lines are the whole loop: take a pair, work something out, store it.", "Tick <code>a, b = f()<\/code>. Two lines light up, nine lines apart &mdash; the <code>return<\/code> and the call that catches it. Count the names on each.", "Which of the seven is the only one you have not met before this week?"]}, {"kind": "predict", "question": "Two lists that belong together, walked side by side. What does <code>zip<\/code> give?", "code": "d = [8, 6, 9]\nn = [200, 180, 220]\nprint(list(zip(d, n)))", "options": ["[(8, 200), (6, 180), (9, 220)]", "[8, 6, 9, 200, 180, 220]", "[(8, 6, 9), (200, 180, 220)]", "[208, 186, 229]"], "explain": "One pair per position. <code>for di, ni in zip(d, n):<\/code> gives one day at a time: tuple unpacking, as in <code>.items()<\/code>.", "answer": 0, "output": "[(8, 200), (6, 180), (9, 220)]"}, {"kind": "trace", "title": "Step through p_chart for three days", "code": "def p_chart(defectives, sizes):\n    pbar = sum(defectives) / sum(sizes)\n    p, ucl, lcl = [], [], []\n    for d, n in zip(defectives, sizes):\n        sigma = (pbar * (1 - pbar) / n) ** 0.5\n        p.append(d / n)\n        ucl.a irs the items up, one tuple per position.", "star": false, "output": "[('a', 1), ('b', 2)]"}, {"id": "7.2", "kind": "Fill in", "title": "Complete p_chart", "task": "Complete <code>p_chart<\/code>: the p̄ line and the three <code>append<\/code> lines.", "solution": "def p_chart(defectives, sizes):\n    pbar = sum(defectives) / sum(sizes)\n    p, ucl, lcl = [], [], []\n    for d, n in zip(defectives, sizes):\n        sigma = (pbar * (1 - pbar) / n) ** 0.5\n        p.append(d / n)\n        ucl.append(pbar + 3 * sigma)\n        lcl.append(max(0.0, pbar - 3 * sigma))\n    return pbar, p, ucl, lcl\n\npbar, p, ucl, lcl = p_chart(d, n)\nprint(round(pbar, 4))       # 0.0436", "see": "0.0436", "mistake": "<code>pbar = mean(p)<\/code>, the average of the daily proportions. The given formula divides the <b>total<\/b> defectives by the <b>total<\/b> inspected.", "star": false, "output": "0.0436"}, {"id": "7.3", "kind": "Fill in", "title": "Flag the days", "task": "Flag the days outside the limits, as <b>day numbers<\/b>.", "solution": "out = [i + 1 for i in range(len(p)) if p[i] > ucl[i] or p[i] < lcl[i]]\nprint(out)", "see": "[9]", "mistake": "Comparing with <code>ucl<\/code> (the whole list) instead of <code>ucl[i]<\/code>: each day has its <b>own<\/b> limit.", "star": false, "output": "[9]"}, {"id": "7.4", "kind": "Predict", "title": "Change day 9", "task": "<b>Predict first:<\/b> if day 9 had 15 defective boards instead of 19, would it still be a signal? Change it, run, and set <code>still_signal<\/code>.", "solution": "d2 = d.copy()\nd2[8] = 15                          # day 9 is at position 8\npbar2, p2, ucl2, lcl2 = p_chart(d2, n)\nprint(round(p2[8], 3), round(ucl2[8], 3))\n\nstill_signal = False", "see": "0.075 0.085", "mistake": "Changing <code>d2[9]<\/code>: that is day 10. Positions count from 0.", "star": false, "output": "0.075 0.085"}, {"id": "7.5", "kind": "Write it", "title": "Plot a limit that changes", "task": "Plot <code>p<\/code>, and draw the UCL <b>list<\/b is the whole difference."}], "code": "# GIVEN by the customer\nUSL, LSL = 500.8, 499.2\n\n# from YOUR measurements\nmu    = res[\"X_CL\"]\nsigma = res[\"R_CL\"] / 2.326\n\ncp  = (USL - LSL) / (6 * sigma)\ncpk = min((USL - mu) / (3 * sigma),\n          (mu - LSL) / (3 * sigma))", "tasks": ["Click <b>USL<\/b>, then <b>UCL vs USL<\/b>. Which of the two pairs of limits would change if you measured a hundred more bottles, and which would not?", "Click <b>C<sub>p<\/sub><\/b>. Two bars appear: the customer's window and what the machine produces. Which is wider on M1 &mdash; and by how much?", "Click <b>C<sub>pk<\/sub><\/b> and switch between <b>M1<\/b> and <b>M2<\/b>. The hill is the same width both times, so why does C<sub>pk<\/sub> collapse from 1.30 to 0.76?"]}, {"kind": "idea", "tag": "GIVEN", "title": "Capability: the formulas are given", "points": ["USL, LSL: the customer's limits. μ: the process mean. σ: the process spread.", "C<sub>p<\/sub> ignores where the mean is; C<sub>pk<\/sub> looks at the <b>nearer<\/b> limit.", "<b>Why<\/b> these are good measures is not examined."], "fhead": ["formula or rule (given)", "Python"], "formulas": [["C<sub>p<\/sub> = (USL − LSL) / 6σ", "(usl - lsl) / (6 * sigma)"], ["C<sub>pk<\/sub> = min( (USL − μ)/3σ, (μ − LSL)/3σ )", "min((usl - mu) / (3 * sigma), (mu - lsl) / (3 * sigma))"], ["C<sub>pk<\/sub> below 1.00", "\"Incapable\""], ["1.00 to 1.33", "\"Marginal\""], ["1.33 to 1.67", "\"Capable\""], ["1.67 and above", "\"Excellent\""]]}, {"kind": "predict", "question": "What does <code>rate(1.33)<\/code> return?", "code": "def rate(cpk):\n    if cpk < 1.00:\n        return \"Incapable\"\n    elif cpk < 1.33:\n        return \"Marginal\"\n    elif cpk < 1.67:\n        return \"Capable\"\n    else:\n        return \"Excellent\"\n\nprint(rate(1.33))", "options": ["Marginal", "Capable", "Excellent", "Incapable"], "explain": "<code>1.33 &lt; 1.00<\/code> is False, <code>1.33 &lt; 1.33<\/code> is False, <code>1.33 &lt; 1.67<\/code> is True.  other two can never run. Every value below 1.67 is called “Capable”, including a process that makes defects every day. <b>With <code>&lt;<\/code> tests, go from the smallest threshold up.<\/b> This is tutorial exercise 2.2 with higher stakes.", "got": "Capable"}, {"kind": "demo", "title": "Check by hand first", "code": "def cp_cpk(usl, lsl, mu, sigma):\n    cp  = (usl - lsl) / (6 * sigma)\n    cpk = min((usl - mu) / (3 * sigma),\n              (mu - lsl) / (3 * sigma))\n    return cp, cpk\n\ndef rate(cpk):\n    if cpk < 1.00:\n        return \"Incapable\"\n    elif cpk < 1.33:\n        return \"Marginal\"\n    elif cpk < 1.67:\n        return \"Capable\"\n    else:\n        return \"Excellent\"\n\ncp, cpk = cp_cpk(502, 498, 500.20, 0.42)\nprint(round(cp, 2), round(cpk, 2), rate(cpk))\n\ncp, cpk = cp_cpk(502, 498, 501.00, 0.42)\nprint(round(cp, 2), round(cpk, 2), rate(cpk))", "points": ["<b>First line:<\/b> the worked example from the Week 6 notes: C<sub>p<\/sub> = 4/2.52 = 1.59, C<sub>pk<\/sub> = 1.80/1.26 = 1.43. Code and hand agree.", "<b>Second line:<\/b> same spread, mean moved to 501.0. C<sub>p<\/sub> does not change; C<sub>pk<\/sub> falls to 0.79.", "That difference is exactly what the <code>min(...)<\/code> in <code>cp_cpk<\/code> is for."], "output": "1.59 1.43 Capable\n1.59 0.79 Incapable"}, {"kind": "live", "mode": "capability", "title": "Move the mean and the spread", "tasks": ["Start from <b>M2<\/b>. Move the mean back to 500.00. What happens to C<sub>pk<\/sub>? To C<sub>p<\/sub>?", "Halve σ. What happens to both numbers?", "Keep the mean at 500.30. What is the largest σ that still gives “Capable”?"], "usl": 500.8, "lsl": 499.2, "presets": {"M1": {"mu": 499.998, "sigma": 0.204}, "M2": {"mu": 500.299, "sigma": 0.219}}}, {"kind": "demo", "title": "The three-line report", "code": "def cp_cpk(usl, lsl, mu, sigma):\n    cp  = (usl - lsl) / (6 * sigma)\n    cpk = min((usl - mu) / (3 * sigma),\n              (mu - lsl) / (3 * sigma))\n    return cp, cpk\n\ndef rate(cpk):\n    if cpk < 1.00:\n        return \"Incapable\"\n    elif cpk < 1.33:\n        return \"Marginal\"\n    elif cpk < 1.67:\n        return \"Capable\"\n    else:\n        return \"Excellent\"\n\nUSL, LSL = 500.8, 499.2               # GIVEN: the customer's limits\nfor machine, d in df.groupby(\"machine\"):\n    res = analyse(d)                   # last session\n    signals = sorted(res[\"rule1\"] + res[\"rule4\"])\n    if signals:\n        print(f\"{machine}: not stable (signals at {signals}), fix first\")\n        continue\n    sigma = res[\"R_CL\"] / 2.326        # GIVEN: Rbar / d2, d2 = 2.326\n    cp, cpk = cp_cpk(USL, LSL, res[\"X_CL\"], sigma)\n    print(f\"{machine}: Cp {cp:.2f}, Cpk {cpk:.2f}, {rate(cpk)}\")", "points": ["<b>The whole fortnight in one loop:<\/b> <code>analyse<\/code> from last session decides whether a machine is stable; only then does <code>cp_cpk<\/code> run.", "<code>if signals:<\/code> an empty list counts as False.", "<code>continue<\/code> skips the rest of this pass and moves to the next machine.", "<b>M1:<\/b> centred, stable, C<sub>pk<\/sub> 1.30 just under 1.33: Marginal. <b>M2:<\/b> stable but shifted towards USL: Incapable. <b>M3:<\/b> not stable, so no capability is reported at all."], "output": "M1: Cp 1.31, Cpk 1.30, Marginal\nM2: Cp 1.22, Cpk 0.76, Incapable\nM3: not stable (signals at [8, 13, 15, 16, 19]), fix first"}, {"kind": "yourturn", "minutes": 12}, {"kind": "check"}, {"kind": "table", "title": "What is examinable from Session 2", "rows": [["<code>zip<\/code>, and unpacking <code>for d, n in zip(...)<\/code>", "np, c and u charts"], ["Write <code>p_chart<\/code>; the <code>max(0.0, ...)<\/code> floor", "Binomial and Poisson models"], ["Returning and unpacking several values", "P<sub>p<\/sub>, P<sub>pk<\/sub>, DPMO, sigma level"], ["Write <code>cp_cpk<\/code> and <code>rate<\/code>; the order of <code>elif<\/code>", "Non-normal data, Box-Cox"], ["<code>if list:<\/code> and <code>continue<\/code> in a loop", " : the test for signals and the line that skips to the next machine. The lines are also collected in <code>lines<\/code> for the checker.", "solution": "USL, LSL = 500.8, 499.2               # GIVEN: the customer's limits\nlines = []\nfor machine, d in df.groupby(\"machine\"):\n    res = analyse(d)\n    signals = sorted(res[\"rule1\"] + res[\"rule4\"])\n    if signals:\n        lines.append(f\"{machine}: not stable (signals at {signals}), fix first\")\n        continue\n    sigma = res[\"R_CL\"] / 2.326        # GIVEN: Rbar / d2, d2 = 2.326\n    cp, cpk = cp_cpk(USL, LSL, res[\"X_CL\"], sigma)\n    lines.append(f\"{machine}: Cp {cp:.2f}, Cpk {cpk:.2f}, {rate(cpk)}\")\n\nfor line in lines:\n    print(line)", "see": "three lines: M1 Marginal, M2 Incapable, M3 not stable", "mistake": "Leaving out <code>continue<\/code>: M3 then prints <b>both<\/b> lines, including a capability number that should never have been computed.", "star": false, "output": "M1: Cp 1.31, Cpk 1.30, Marginal\nM2: Cp 1.22, Cpk 0.76, Incapable\nM3: not stable (signals at [8, 13, 15, 16, 19]), fix first"}, {"id": "8.5", "kind": "Write it", "title": "The report as a table", "task": "Collect the stable machines into a list of dictionaries (machine, Cp, Cpk, rating) and turn it into a DataFrame.", "solution": "rows = []\nfor machine, d in df.groupby(\"machine\"):\n    res = analyse(d)\n    if res[\"rule1\"] or res[\"rule4\"]:\n        continue\n    sigma = res[\"R_CL\"] / 2.326\n    cp, cpk = cp_cpk(USL, LSL, res[\"X_CL\"], sigma)\n    rows.append({\"machine\": machine, \"Cp\": round(cp, 2), \"Cpk\": round(cpk, 2), \"rating\": rate(cpk)})\nreport = pd.DataFrame(rows)\nprint(report)", "see": "a 2-row table: M1 and M2", "mistake": "Appending M3 as well: an unstable process has no meaningful capability, so it is skipped.", "star": true, "output": "  machine    Cp   Cpk     rating\n0      M1  1.31  1.30   Marginal\n1      M2  1.22  0.76  Incapable"}]}], "summary": [["mean, moving_ranges", "a list", "a number /* ---------------- SPC arithmetic (a JavaScript copy of the Python functions) ---------------- */
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const movingRanges=x=>x.slice(1).map((v,i)=>Math.abs(v-x[i]));
function imrLimits(x){ const xb=mean(x), mr=mean(movingRanges(x)), s=mr/1.128; return {CL:xb,UCL:xb+3*s,LCL:xb-3*s,MR_CL:mr,MR_UCL:3.267*mr}; }
const rule1=(x,lcl,ucl)=>x.map((v,i)=>(v>ucl||v<lcl)?i:-1).filter(i=>i>=0);
function rule4(x,cl){ const s=[]; for(let i=0;i<x.length-7;i++){ const w=x.slice(i,i+8); if(w.every(v=>v>cl)||w.every(v=>v<cl)) s.push(i);} return s; }
function pChart(d,n){ const pbar=d.reduce((a,b)=>a+b,0)/n.reduce((a,b)=>a+b,0), p=[],ucl=[],lcl=[];
  d.forEach((di,i)=>{ const s=Math.sqrt(pbar*(1-pbar)/n[i]); p.push(di/n[i]); ucl.push(pbar+3*s); lcl.push(Math.max(0,pbar-3*s)); }); return {pbar,p,ucl,lcl}; }
function cpCpk(usl,lsl,mu,s){ return [(usl-lsl)/(6*s), Math.min((usl-mu)/(3*s),(mu-lsl)/(3*s))]; }
const rate=c=>c<1.00?"Incapable":c<1.33?"Marginal":c<1.67?"Capable":"Excellent";
const pyList=a=>"["+a.join(", ")+"]";
const r4d=v=>{ const s=String(+(Math.round(v*1e4)/1e4).toFixed(4)); return s.includes(".")?s:s+".0"; };
const f1=v=>(Math.round(v*10)/10).toFixed(1).replace(/\.0$/,".0");

/* ---------------- control chart (SVG) ---------------- */
function chart(svg, o){
  const W=640, H=o.h||250, L=48, R=W-96, T=26, B=H-30;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML="";
  const n=o.values.length, x0=o.x0||1;
  const lo=o.ymin, hi=o.ymax;
  const X=i=>L+(n===1?0:(R-L)*i/(n-1)), Y=v=>B-(B-T)*(v-lo)/(hi-lo);
  const ttl=el("text",{x:L,y:16,class:"ttl"},svg); ttl.textContent=o.title||"";
  el("line",{x1:L,x2:R+10,y1:B,y2:B,class:"ax"},svg);
  const spans=[]; (o.windows||[]).forEach(s=>{ const last=spans[spans.length-1]; if(last&&s<=last[1]+1) last[1]=Math.max(last[1],s+7); else spans.push([s,s+7]); });
  spans.forEach(([a,z])=>el("rect",{x:X(a)-8,y:T-6,width:X(z)-X(a)+16,height:B-T+6,class:"win"},svg));
  [["UCL",o.ucl,true],["CL",o.cl,false],["LCL",o.lcl,true]].forEach(([nm,v,d])=>{ if(v==null) return;
    if(Array.isArray(v)){ const hw=n>1?(X(1)-X(0))/2:10; let pts=[]; v.forEach((u,i)=>{ pts.push(`${X(i)-hw},${Y(u)}`,`${X(i)+hw},${Y(u)}`); });
      el("polyline",{points:pts.join(" "),class:"step"},svg); const t=el("text",{x:R+16,y:Y(v[v.length-1])+4,class:"lab"},svg); t.textContent=nm; return; }
    el("line",{x1:L,x2:R+10,y1:Y(v),y2:Y(v),class:"lim"+(d?" d":"")},svg);
    const t=el("text",{x:R+16,y:Y(v)+4,class:"lab"},svg); t.textContent=`${nm} ${v.toFixed(o.dec??2)}`; });
  for(let i=0;i<n;i++){ if(n<=25||i%2===0){ const t=el("text",{x:X(i),y:B+16,class:"tk","text-anchor":"middle"},svg); t.textContent=i+x0; } }
  const yt=el("text",{x:8,y:T+4,class:"tk"},svg); yt.textContent=o.ylabel||"";
  el("polyline",{points:o.values.map((v,i)=>`${X(i)},${Y(v)}`).join(" "),class:"ln"},svg);
  (o.flags||[]).forEach(i=>el("circle",{cx:X(i),cy:Y(o.values[i]),r:10,class:"flag"},svg));
  o.values.forEach((v,i)=>{ const c=el("circle",{cx:X(i),cy:Y(v),r:o.drag?7:5,class:"pt"+(o.drag?" drag":""),"data-i":i},svg);
    if(o.drag){ const tl=el("title",{},c); tl.textContent=`${o.xname||"point"} ${i+x0}: ${v}`; } });
  if(o.drag){
    if(svg._cur===undefined) svg._cur=-1;
    const val=ev=>{ const p=svg.createSVGPoint(); p.x=ev.clientX; p.y=ev.clientY; const q=p.matrixTransform(svg.getScreenCTM().inverse());
      let v=lo+(B-q.y)/(B-T)*(hi-lo); v=Math.round(v/o.step)*o.step; v=Math.max(o.min,Math.min(o.max,v)); return Math.round(v*100)/100; };
    svg.onpointerdown=ev=>{ const t=ev.target; if(t.dataset&&t.dataset.i!==undefined){ svg._cur=+t.dataset.i; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); } };
    svg.onpointermove=ev=>{ const c=svg._cur; if(c<0) return; const v=val(ev); if(v!==o.values[c]) o.drag(c,v); };
    svg.onpointerup=svg.onpointercancel=()=>{ svg._cur=-1; };
  }
}

  e.innerHTML=head(card,esc(L.title),sub)+`<div class="two wide-left"><div id="charts"></div>

    ${L.mode!=="machines"?`<div class="row" style="margin-top:10px"><button class="btn sm" id="rs">Start again</button></div>`:""}</div></div>`;
  const box=$("#charts");
  if(L.mode==="machines"){
    const M=L.machines, names=Object.keys(M); let all=[];
    names.forEach(m=>{ const q=M[m]; all=all.concat(q.xbars,[q.lim.X_UCL,q.lim.X_LCL]); });
    const lo=Math.floor(Math.min(...all)*20)/20-0.05, hi=Math.ceil(Math.max(...all)*20)/20+0.05;
    box.innerHTML=`<div class="mtabs">${names.map(m=>`<button class="mtab" data-m="${m}">${m}<span class="dot ${M[m].r1.length||M[m].r4.length?"bad":""}"></span></button>`).join("")}</div><svg class="cc" id="c1"></svg><svg class="cc" id="c2"></svg>
      <p class="hint">Same vertical scale for all three machines, so you can compare their centre lines.</p>`;
    const show=m=>{ const q=M[m], l=q.lim;
      box.querySelectorAll(".mtab").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
      chart($("#c1"),{values:q.xbars,cl:l.X_CL,ucl:l.X_UCL,lcl:l.X_LCL,ymin:lo,ymax:hi,flags:q.r1,windows:q.r4,title:`Machine ${m}: X̄ chart (grams). Rule 1 circled, Rule 4 shaded`,dec:3,h:250});
      chart($("#c2"),{values:q.ranges,cl:l.R_CL,ucl:l.R_UCL,lcl:l.R_LCL,ymin:0,ymax:1.3,flags:q.r1r,title:"R chart (grams)",dec:3,h:190});
      $("#lc").innerHTML=`res = analyse(df[df["machine"] == "${m}"])

print(round(res["X_CL"], 3))    <span class="res">${l.X_CL.toFixed(3)}</span>
print(round(res["X_UCL"], 3))   <span class="res">${l.X_UCL.toFixed(3)}</span>
print(round(res["X_LCL"], 3))   <span class="res">${l.X_LCL.toFixed(3)}</span>
print(res["rule1"])             <span class="res">${pyList(q.r1.map(i=>i+1))}</span>
print(res["rule4"])             <span class="res">${pyList(q.r4.map(i=>i+1))}</span>

<span class="cm"># subgroup numbers, not positions</span>`; };
    box.querySelectorAll(".mtab").forEach(b=>b.onclick=()=>show(b.dataset.m));
    show("M3");
  } else if(L.mode==="pchart"){
    box.innerHTML=`<svg class="cc" id="c1"></svg><div class="cntrow" id="cnt"></div>`;
    let d=L.d.slice(), sel=8; const n=L.n, MAXD=30;
    const draw=()=>{
      const r=pChart(d,n), out=r.p.map((v,i)=>(v>r.ucl[i]||v<r.lcl[i])?i:-1).filter(i=>i>=0);
      chart($("#c1"),{values:r.p,cl:r.pbar,ucl:r.ucl,lcl:r.lcl,ymin:0,ymax:0.17,flags:out,title:"p chart: proportion defective per day",dec:4,xname:"day",h:280,
        drag:(i,v)=>{ const k=Math.max(0,Math.min(MAXD,Math.round(v*n[i]))); sel=i; if(k!==d[i]){ d[i]=k; draw(); } },step:0.001,min:0,max:0.17});
      $("#cnt").innerHTML=d.map((x,i)=>`<div class="cnt ${out.includes(i)?"flag":""}" title="day ${i+1}: ${x} of ${n[i]}"><button data-i="${i}" data-s="-1" aria-label="fewer on day ${i+1}">−</button><span>d${i+1}: ${x}</span><button data-i="${i}" data-s="1" aria-label="more on day ${i+1}">+</button></div>`).join("");
      $("#cnt").querySelectorAll("button").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; d[i]=Math.max(0,Math.min(MAXD,d[i]+ +b.dataset.s)); sel=i; draw(); });
      const s=sel;
      $("#lc").innerHTML=`d = ${pyList(d)}
n = ${pyList(n)}
pbar, p, ucl, lcl = p_chart(d, n)
print(round(pbar, 4))   <span class="res">${r4d(r.pbar)}</span>

out = [i + 1 for i in range(len(p))
       if p[i] > ucl[i] or p[i] < lcl[i]]
print(out)              <span class="res">${pyList(out.map(i=>i+1))}</span>

<span class="cm"># day ${s+1}: ${d[s]} defective out of ${n[s]}</span>
print(round(p[${s}], 4), round(ucl[${s}], 4), round(lcl[${s}], 4))
<span class="res">${r4d(r.p[s])} ${r4d(r.ucl[s])} ${r4d(r.lcl[s])}</span>`;
    };
    $("#rs").onclick=()=>{ d=L.d.slice(); sel=8; draw(); };
    draw();
  } else if(L.mode==="capability"){
    const P=L.presets, USL=L.usl, LSL=L.lsl; let mu=P.M1.mu, sg=P.M1.sigma;
    box.innerHTML=`<svg class="cc" id="c1"></svg>
      <div class="sl"><span>mean μ</span><input type="range" id="smu" min="499.5" max="500.5" step="0.001"><b id="vmu"></b></div>
      <div class="sl"><span>spread σ</span><input type="range" id="ssg" min="0.05" max="0.40" step="0.001"><b id="vsg"></b></div>
      <div class="row" style="margin-top:6px">${Object.keys(P).map(m=>`<button class="btn sm" data-p="${m}">Machine ${m}</button>`).join("")}</div>`;
    const svg=$("#c1");
    const draw=()=>{
      const W=640,H=230,Lx=30,Rx=W-30,T=26,B=H-30,a=498.9,z=501.1, X=v=>Lx+(Rx-Lx)*(v-a)/(z-a);
      const pdf=v=>Math.exp(-0.5*((v-mu)/sg)**2), Y=f=>B-(B-T-12)*f;
      svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML="";
      el("text",{x:Lx,y:16,class:"ttl"},svg).textContent="Bottle weights (grams) against the customer's limits";
      el("line",{x1:Lx,x2:Rx,y1:B,y2:B,class:"ax"},svg);
      const seg=(p,q,cls)=>{ const pts=[]; for(let k=0;k<=80;k++){ const v=p+(q-p)*k/80; pts.push(`${X(v)},${Y(pdf(v))}`); }
        el("polygon",{points:`${X(p)},${B} ${pts.join(" ")} ${X(q)},${B}`,class:cls},svg); };
      seg(a,z,"curve");
      if(mu-4*sg<LSL) seg(Math.max(a,mu-5*sg),LSL,"flagarea");
      if(mu+4*sg>USL) seg(USL,Math.min(z,mu+5*sg),"flagarea");
      [["LSL",LSL],["USL",USL]].forEach(([nm,v])=>{ el("line",{x1:X(v),x2:X(v),y1:T,y2:B,class:"spec"},svg); el("text",{x:X(v)+5,y:T+10,class:"lab"},svg).textContent=`${nm} ${v}`; });
      el("line",{x1:X(mu),x2:X(mu),y1:T+12,y2:B,class:"mu"},svg); el("text",{x:X(mu)+5,y:B-8,class:"lab"},svg).textContent=`μ ${mu.toFixed(3)}`;
      for(let v=499;v<=501.01;v+=0.5){ el("text",{x:X(v),y:B+16,class:"tk","text-anchor":"middle"},svg).textContent=v.toFixed(1); }
      const [cp,cpk]=cpCpk(USL,LSL,mu,sg), rt=rate(cpk);
      $("#vmu").textContent=mu.toFixed(3); $("#vsg").textContent=sg.toFixed(3); $("#smu").value=mu; $("#ssg").value=sg;
      $("#lc").innerHTML=`USL, LSL = ${USL}, ${LSL}
mu, sigma = ${mu.toFixed(3)}, ${sg.toFixed(3)}

cp, cpk = cp_cpk(USL, LSL, mu, sigma)
print(round(cp, 2), round(cpk, 2))   <span class="res">${cp.toFixed(2)} ${cpk.toFixed(2)}</span>
print(rate(cpk))                     <span class="res">${rt}</span>

<span class="cm"># the nearer limit decides Cpk:</span>
<span class="cm"># (USL - mu) / (3 * sigma) = ${((USL-mu)/(3*sg)).toFixed(2)}</span>
<span class="cm"># (mu - LSL) / (3 * sigma) = ${((mu-LSL)/(3*sg)).toFixed(2)}</span>

<span class="rate ${rt}">${rt}</span>`;
    };
    $("#smu").oninput=ev=>{ mu=+ev.target.value; draw(); }; $("#ssg").oninput=ev=>{ sg=+ev.target.value; draw(); };
    box.querySelectorAll("button[data-p]").forEach(b=>b.onclick=()=>{ mu=P[b.dataset.p].mu; sg=P[b.dataset.p].sigma; draw(); });
    $("#rs").onclick=()=>{ mu=P.M1.mu; sg=P.M1.sigma; draw(); };
    draw();
  } else { liveW7(L,box); }
};

/* ---------------- week 7 refinement: three cards you drive yourself ---------------- */
function liveW7(L, box){

  /* ===== A · the three pandas moves, ticked on one at a time ===== */
  if(L.mode==="moves"){
    const STEP=[{c:'d = df[df["machine"] == "M1"]',
                 nm:"keep one machine's rows",
                 ex:"a filter: a condition inside df[ ... ]"},
                {c:'stats = d.groupby("subgroup")["weight"].agg(["mean", "min", "max"])',
                 nm:"one row per subgroup",
                 ex:"group, then one column per statistic"},
                {c:'stats["range"] = stats["max"] - stats["min"]',
                 nm:"a new column from two old ones",
                 ex:"every row at once, with no loop"}];
    const SHAPE=L.shapes, NOTE=[
      "<b>Nothing has run yet.</b> 300 rows, one per bottle, and three columns.",
      "<b>Same three columns, a third of the rows.</b> The first rows look identical &mdash; only the "
       +"<b>shape</b> and the list of machines tell you the filter worked.",
      "<b>Twenty rows now, one per subgroup</b>, and the subgroup number has become the row label. "
       +"This is the loop you wrote in Week 6, done for you.",
      "<b>A fourth column appeared.</b> <code>stats[\"max\"] - stats[\"min\"]</code> subtracts two whole "
       +"columns in one go: that is R for every subgroup at once."];
    let on=[false,false,false];
    const stage=()=>on[0]?(on[1]?(on[2]?3:2):1):0;

    box.innerHTML=`<div class="panelbox">
        <div id="tg"></div>
        <div class="shape" id="sh"></div>
        <div id="tw" style="overflow-x:auto"></div>
        <div class="notebox" id="nb"></div></div>`;

    const draw=()=>{
      const st=stage();
      $("#tg").innerHTML=STEP.map((s,i)=>{
        const locked = i>0 && !on[i-1];
        return `<label class="stoprow ${on[i]?"on":""}" title="${esc(s.ex)}">
          <input type="checkbox" data-i="${i}" ${on[i]?"checked":""} ${locked?"disabled":""}>
          <code>${hl(s.c)}</code>
          <span class="km">${locked?"needs step "+i:"step "+(i+1)}</span></label>`; }).join("");
      $("#tg").querySelectorAll("input").forEach(c=>c.onchange=()=>{
        const i=+c.dataset.i; on[i]=c.checked;
        if(!on[i]) for(let j=i+1;j<3;j++) on[j]=false;      // a later step cannot outlive its own
        draw(); });

      $("#sh").innerHTML=SHAPE.map((s,i)=>
        `<span class="s ${i===st?"now":""}">(${s[0]}, ${s[1]})</span>`).join('<span class="ar">&rarr;</span>')
        +`<span style="margin-left:auto;color:var(--ink-3)">rows &times; columns</span>`;

      let h;
      if(st<2){
        h=`<table class="raw"><thead><tr><th class="n"></th><th>machine</th><th>subgroup</th><th>weight</th></tr></thead><tbody>`
          +L.head.map((r,i)=>`<tr class="${st===1?"hi":""}"><td class="n">${i}</td>`
            +r.map(v=>`<td>${esc(v)}</td>`).join("")+`</tr>`).join("")
          +`<tr><td class="n"></td><td class="dots" colspan="3">… ${SHAPE[st][0]-5} more rows</td></tr></tbody></table>`;
      } else {
        const cols=["mean","min","max"].concat(st===3?["range"]:[]);
        h=`<table class="raw"><thead><tr><th>subgroup</th>${cols.map(c=>
            `<th class="${c==="range"?"new":""}">${c}</th>`).join("")}</tr></thead><tbody>`
          +L.stats.map(r=>`<tr><td class="n" style="opacity:1;text-align:left">${r[0]}</td>`
            +cols.map((c,j)=>`<td class="${c==="range"?"new":""}">${esc(r[j+1])}</td>`).join("")+`</tr>`).join("")
          +`<tr><td class="dots" colspan="${cols.length+1}">… 17 more subgroups</td></tr></tbody></table>`;
      }
      $("#tw").innerHTML=h;
      $("#nb").innerHTML=NOTE[st];

      const grey=s=>`<span class="cm"># ${esc(s)}</span>`;
      const lines=[hl('df = pd.read_csv("bottle_fill_machines.csv")'),""]
        .concat(STEP.map((s,i)=>on[i]?hl(s.c):grey(s.c)));
      $("#lc").innerHTML=lines.join("\n")+`

${hl("df.shape")}                 <span class="res">(300, 3)</span>
${hl('df["machine"].unique()')}   <span class="res">${pyStr(L.uniq.all)}</span>`
        +(on[0]?`
${hl("d.shape")}                  <span class="res">(${SHAPE[1].join(", ")})</span>
${hl('d["machine"].unique()')}    <span class="res">${pyStr(L.uniq.m1)}</span>`:"")
        +(on[1]?`
${hl("stats.shape")}              <span class="res">(${SHAPE[st].join(", ")})</span>
${hl("list(stats.columns)")}      <span class="res">${pyStr(["mean","min","max"].concat(on[2]?["range"]:[]))}</span>`:"");
    };
    $("#rs").onclick=()=>{ on=[false,false,false]; draw(); };
    draw(); return;
  }

  /* ===== B · the p chart worked out by hand, one column per line of the formula ===== */
  if(L.mode==="pbyhand"){
    let d=L.d.slice(), n=L.n.slice();
    const f4=v=>v.toFixed(4);
    box.innerHTML=`<div class="panelbox">
        <div id="pw" style="overflow-x:auto"></div>
        <div class="notebox" id="pn"></div></div>`;
    const draw=()=>{
      const r=pChart(d,n), sig=n.map(ni=>Math.sqrt(r.pbar*(1-r.pbar)/ni));
      const flag=r.p.map((v,i)=>(v>r.ucl[i]||v<r.lcl[i])?i:-1).filter(i=>i>=0);
      const sd=d.reduce((a,b)=>a+b,0), sn=n.reduce((a,b)=>a+b,0);
      const stp=(k,i)=>`<span class="stepper"><button data-k="${k}" data-i="${i}" data-s="-1">&minus;</button>`
        +`<span>${k==="d"?d[i]:n[i]}</span><button data-k="${k}" data-i="${i}" data-s="1">+</button></span>`;
      $("#pw").innerHTML=`<table class="pc"><thead><tr>
          <th>day</th>
          <th>n<span class="f">inspected</span></th>
          <th>d<span class="f">defective</span></th>
          <th>p<span class="f">d / n</span></th>
          <th>&sigma;<span class="f">&radic;(p&#772;(1-p&#772;)/n)</span></th>
          <th>UCL<span class="f">p&#772; + 3&sigma;</span></th>
          <th>LCL<span class="f">max(0, p&#772; &minus; 3&sigma;)</span></th></tr></thead><tbody>`
        +d.map((_,i)=>`<tr class="${flag.includes(i)?"flag":""}"><td>${i+1}</td>
            <td>${stp("n",i)}</td><td>${stp("d",i)}</td>
            <td>${f4(r.p[i])}</td><td>${f4(sig[i])}</td><td>${f4(r.ucl[i])}</td><td>${f4(r.lcl[i])}</td></tr>`).join("")
        +`</tbody><tfoot><tr><td colspan="2">totals</td><td>${sd} / ${sn}</td>
            <td colspan="4" style="text-align:left">p&#772; = <b>${f4(r.pbar)}</b>
            <span style="font-weight:500">&nbsp; &mdash; the totals, not the average of the p column</span></td></tr></tfoot></table>`;
      $("#pw").querySelectorAll("button").forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i, s=+b.dataset.s;
        if(b.dataset.k==="d") d[i]=Math.max(0,Math.min(60,d[i]+s));
        else { n[i]=Math.max(100,Math.min(300,n[i]+10*s)); d[i]=Math.min(d[i],n[i]); }
        draw(); });

      const wide=n.indexOf(Math.max(...n)), narrow=n.indexOf(Math.min(...n));
      $("#pn").innerHTML= wide===narrow
        ? "<b>All three days inspect the same number of boards, so all three limits are identical.</b> "
          +"That is the only case where a p chart looks like the charts you drew in Week 6."
        : `<b>Day ${wide+1} inspects the most boards (${n[wide]}) and has the <i>tightest</i> limits; `
          +`day ${narrow+1} inspects the fewest (${n[narrow]}) and has the widest.</b> `
          +"More boards means a more trustworthy proportion, so it takes less of a jump to be a signal. "
          +"<b>That is why UCL and LCL are lists, not single numbers.</b>";

      $("#lc").innerHTML=`d = ${pyList(d)}
n = ${pyList(n)}
pbar, p, ucl, lcl = p_chart(d, n)

${hl("print(round(pbar, 4))")}        <span class="res">${r4d(r.pbar)}</span>
${hl("print([round(v, 4) for v in p])")}
<span class="res">${pyList(r.p.map(r4d))}</span>
${hl("print([round(v, 4) for v in ucl])")}
<span class="res">${pyList(r.ucl.map(r4d))}</span>
${hl("print([round(v, 4) for v in lcl])")}
<span class="res">${pyList(r.lcl.map(r4d))}</span>

<span class="cm"># days outside their own limits</span>
<span class="res">${pyList(flag.map(i=>i+1))}</span>`;
    };
    $("#rs").onclick=()=>{ d=L.d.slice(); n=L.n.slice(); draw(); };
    draw(); return;
  }

  /* ===== C · the Python commands p_chart is built from ===== */
  if(L.mode==="pytools"){
    let on=L.cmds.map(()=>false);
    box.innerHTML=`<div class="cmdlist" id="cl"></div>
      <div class="row" style="margin-top:10px"><button class="btn sm" id="all">Open all</button></div>`;
    const draw=()=>{
      $("#cl").innerHTML=L.cmds.map((c,i)=>`<div class="cmdbox ${on[i]?"on":""}">
        <label class="cmdhead"><input type="checkbox" data-i="${i}" ${on[i]?"checked":""}>
          <span class="nm">${esc(c.nm)}</span><span class="wh">${c.wh}</span></label>
        <div class="cmdbody"><pre>${hl2(c.code)}</pre>
          <div class="o">${esc(c.out)}</div>
          <div class="why">${c.why}</div></div></div>`).join("");
      $("#cl").querySelectorAll("input").forEach(x=>x.onchange=()=>{ on[+x.dataset.i]=x.checked; draw(); });
      const lit=new Set(); L.cmds.forEach((c,i)=>{ if(on[i]) c.lines.forEach(n=>lit.add(n)); });
      $("#lc").innerHTML=L.fn.split("\n").map((l,i)=>{
        const h=hl(l)||" ";
        return lit.has(i+1)?`<span class="lit">${h}</span>`:h; }).join("\n")
        +`\n\n<span class="cm"># ${lit.size?"the highlighted lines use the commands you ticked":"tick a command to light up the lines that use it"}</span>`;
    };
    $("#all").onclick=()=>{ const any=on.some(x=>!x); on=on.map(()=>any); draw(); };
    $("#rs").onclick=()=>{ on=L.cmds.map(()=>false); draw(); };
    draw(); return;
  }

  /* ===== D · what the letters stand for, before any arithmetic ===== */
  if(L.mode==="terms"){
    const U=L.usl, Ls=L.lsl, P=L.presets, T=L.terms;
    const f3=v=>v.toFixed(3), f2=v=>v.toFixed(2);
    let who=Object.keys(P)[0], sel=T[0].id;

    box.innerHTML=`<div class="termrow" id="tr"></div>
      <svg class="cc" id="c1"></svg>
      <div class="mtabs" id="mt" style="margin:2px 0 0"></div>
      <p class="hint" style="margin:4px 0 0">The same letters, on either of the two machines whose
        report you will print at the end of this session.</p>
      <div class="termdef" id="td"></div>`;

    const draw=()=>{
      const q=P[who], mu=q.mu, sg=q.sigma;
      const cp=(U-Ls)/(6*sg);
      const up=(U-mu)/(3*sg), lo=(mu-Ls)/(3*sg), cpk=Math.min(up,lo);
      const near = up<lo ? "USL" : "LSL";
      const mid=(U+Ls)/2, k=Math.abs(mid-mu)/((U-Ls)/2);
      const t=T.find(x=>x.id===sel);

      $("#tr").innerHTML=T.map(x=>`<button data-t="${x.id}" class="${x.id===sel?"on":""}">${x.nm}</button>`).join("");
      $("#tr").querySelectorAll("button").forEach(b=>b.onclick=()=>{ sel=b.dataset.t; draw(); });
      $("#mt").innerHTML=Object.keys(P).map(m=>`<button class="mtab ${m===who?"on":""}" data-p="${m}">Machine ${m}</button>`).join("");
      $("#mt").querySelectorAll("button").forEach(b=>b.onclick=()=>{ who=b.dataset.p; draw(); });

      /* ---- the picture ---- */
      const svg=$("#c1"), W=640,H=282,Lx=36,Rx=W-36,TOP=26,CB=178,B1=204,B2=232;
      const a=498.8, z=501.2, X=v=>Lx+(Rx-Lx)*(v-a)/(z-a);
      const pdf=v=>Math.exp(-0.5*((v-mu)/sg)**2), Y=f=>CB-(CB-TOP-8)*f;
      svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML="";
      el("text",{x:Lx,y:15,class:"ttl"},svg).textContent=
        `Machine ${who}: the weight of one bottle, in grams`;
      const dim = sel==="vs" ? " faint" : "";
      const pts=[]; for(let i=0;i<=120;i++){ const v=a+(z-a)*i/120; pts.push(`${X(v)},${Y(pdf(v))}`); }
      el("polygon",{points:`${X(a)},${CB} ${pts.join(" ")} ${X(z)},${CB}`,class:"curve"+dim},svg);
      el("line",{x1:Lx,x2:Rx,y1:CB,y2:CB,class:"ax"},svg);

      [["LSL",Ls],["USL",U]].forEach(([nm,v])=>{
        const on = sel===nm || sel==="Cp" || sel==="vs" || (sel==="Cpk" && nm===near);
        el("line",{x1:X(v),x2:X(v),y1:TOP,y2:B2+10,class:"spec"+(on?" lit":" faint")},svg);
        el("text",{x:X(v)+5,y:TOP+11,class:"lab"+(sel===nm?" lit":"")},svg).textContent=`${nm} ${v}`; });
      const muOn = sel==="mu"||sel==="Cpk"||sel==="sigma";
      el("line",{x1:X(mu),x2:X(mu),y1:TOP+14,y2:B2+10,class:"mu"+(muOn?" lit":" faint")},svg);
      el("text",{x:X(mu)+5,y:CB-8,class:"lab"+(sel==="mu"?" lit":"")},svg).textContent=`μ ${f3(mu)}`;

      const bar=(v1,v2,y,label,cls)=>{
        el("line",{x1:X(v1),x2:X(v2),y1:y,y2:y,class:"meas "+cls},svg);
        [v1,v2].forEach(v=>el("line",{x1:X(v),x2:X(v),y1:y-6,y2:y+6,class:"meas "+cls},svg));
        el("text",{x:(X(v1)+X(v2))/2,y:y-10,class:"measlab "+cls,"text-anchor":"middle"},svg).textContent=label; };

      if(sel==="sigma") bar(mu,mu+sg,B1,`σ = ${f3(sg)} g`,"b");
      if(sel==="Cp"){ bar(Ls,U,B1,`what the customer allows:  USL − LSL = ${f3(U-Ls)}`,"b");
                      bar(mu-3*sg,mu+3*sg,B2,`what the machine produces:  6σ = ${f3(6*sg)}`,"r"); }
      if(sel==="Cpk"){ const w1 = near==="USL" ? [mu,U] : [Ls,mu];
                       bar(w1[0],w1[1],B1,`to the nearer wall:  ${near==="USL"?`USL − μ`:`μ − LSL`} = ${f3(near==="USL"?U-mu:mu-Ls)}`,"b");
                       bar(mu,mu+3*sg,B2,`half the machine's width:  3σ = ${f3(3*sg)}`,"r"); }
      for(let v=499;v<=501.01;v+=0.4) el("text",{x:X(v),y:H-8,class:"tk","text-anchor":"middle"},svg).textContent=v.toFixed(1);

      /* ---- the definition ---- */
      const VAL={usl:`<b>${U}</b> grams`, lsl:`<b>${Ls}</b> grams`,
                 mu:`<b>${f3(mu)}</b> grams on machine ${who}`,
                 sigma:`<b>${f3(sg)}</b> grams on machine ${who}`,
                 cp:`${f3(U-Ls)} ÷ ${f3(6*sg)} = <b>${f2(cp)}</b> on machine ${who}`,
                 cpk:`${f3(near==="USL"?U-mu:mu-Ls)} ÷ ${f3(3*sg)} = <b>${f2(cpk)}</b> on machine ${who}`};
      let extra="";
      if(sel==="Cpk") extra=`<div class="ln"><span class="k">the nearer wall</span><span class="v">`
        +`Up to USL it is ${f2(up)}, down to LSL it is ${f2(lo)}. <code>min</code> takes the smaller, `
        +`so on machine ${who} the <b>${near}</b> side decides. The centring factor is k = ${f2(k)}, `
        +`and C<sub>pk</sub> = C<sub>p</sub> × (1 − k) = ${f2(cp)} × ${f2(1-k)} = <b>${f2(cp*(1-k))}</b>.</span></div>`;
      if(sel==="Cp") extra=`<div class="ln"><span class="k">read it as</span><span class="v">`
        +`&ldquo;the customer's window is <b>${f2(cp)}</b> times as wide as the machine's output.&rdquo; `
        +`Above 1 the output fits; below 1 it cannot, wherever you centre it.</span></div>`;
      if(sel==="vs") extra=`<table class="vstab"><tr><th>limit</th><th>where the number comes from</th><th>what it is a limit on</th></tr>`
        +`<tr class="c"><td>UCL, LCL</td><td>your own measurements, through <code>xbar_r_limits</code></td><td>the subgroup means you plotted</td></tr>`
        +`<tr class="s"><td>USL, LSL</td><td>the customer, in the contract</td><td>one individual bottle</td></tr></table>`
        +`<p class="hint">They are different quantities, so they are never compared with each other and never`
        +` computed from each other. A process can sit perfectly inside its control limits and still be `
        +`<b>Incapable</b> &mdash; that is machine M2 in the report at the end of this session.</p>`;

      $("#td").innerHTML=`<div class="big">${t.nm}</div><div class="spell">${t.spell}</div>
        <div class="ln"><span class="k">in words</span><span class="v">${t.one}</span></div>
        <div class="ln"><span class="k">comes from</span><span class="v">${t.from}</span></div>`
        +(t.val?`<div class="ln val"><span class="k">right now</span><span class="v">${VAL[t.val]}</span></div>`:"")
        +extra;

      /* ---- the Python, with the lines for this letter lit ---- */
      const lit=new Set(t.lines||[]);
      $("#lc").innerHTML=L.code.split("\n").map((l,i)=>{
        const h=hl(l)||" "; return lit.has(i+1)?`<span class="lit">${h}</span>`:h; }).join("\n")
        +`\n\n${hl("print(round(cp, 2), round(cpk, 2))")}   <span class="res">${f2(cp)} ${f2(cpk)}</span>
${hl("print(rate(cpk))")}                  <span class="res">${rate(cpk)}</span>`;
    };
    $("#rs").onclick=()=>{ who=Object.keys(P)[0]; sel=T[0].id; draw(); };
    draw(); return;
  }
}
/* a Python list / list of strings, written the way Python writes it */
const pyStr=a=>"["+a.map(v=>"'"+v+"'").join(", ")+"]";
/* highlight a multi-line snippet without the line numbers */
const hl2=src=>src.split("\n").map(l=>hl(l)).join("\n");

/* ---------------- navigation ---------------- */
const chips=$("#chips");
let ch=`<button class="chip" data-t="welcome"><b>W${DATA.week.n}</b>Start</button>`;
[1,2].forEach(s=>{ ch+=`<button class="chip sep" data-t="s${s}">▶ Session ${s}</button>`;
  DATA.blocks.filter(b=>b.session===s).forEach(b=>ch+=`<button class="chip" data-t="${b.id}">${esc(b.short)}</button>`); });
ch+=`<button class="chip" data-t="summary">Summary</button>`;
chips.innerHTML=ch;
chips.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ const t=c.dataset.t;
  const i=CARDS.findIndex(x=> t==="welcome"?x.type==="welcome": t==="summary"?x.type==="summary": t[0]==="s"&&t.length===2?(x.type==="session"&&x.session===+t[1]): (x.block&&x.block.id===t)); go(i); });
function go(i){
  cur=Math.max(0,Math.min(CARDS.length-1,i)); const c=CARDS[cur];
  $("#stage").innerHTML=`<article class="card" id="card"></article>`;
  ctl=R[c.type]($("#card"),c)||{};
  const key=c.type==="welcome"?"welcome":c.type==="summary"?"summary":c.type==="session"?"s"+c.session:c.block.id;
  chips.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.t===key));
  const on=chips.querySelector(".chip.on"); if(on) on.scrollIntoView({block:"nearest",inline:"nearest"});
  if(c.block){ const inB=CARDS.filter(x=>x.block===c.block); $("#where").textContent=`Session ${c.session} · ${c.block.short} · ${c.label} · ${inB.indexOf(c)+1} of ${inB.length}`; }
  else $("#where").textContent=c.label;
  $("#prog").style.width=(cur/(CARDS.length-1)*100)+"%";
  $("#prevBtn").disabled=cur===0; $("#nextBtn").disabled=cur===CARDS.length-1;
  history.replaceState(null,"","#"+cur); window.scrollTo(0,0);
}
function next(){ if(ctl.advance&&ctl.advance()) return; if(cur<CARDS.length-1) go(cur+1); }
function prev(){ if(ctl.back&&ctl.back()) return; if(cur>0) go(cur-1); }
$("#nextBtn").onclick=()=>{ if(cur<CARDS.length-1) go(cur+1); };
$("#prevBtn").onclick=()=>{ if(cur>0) go(cur-1); };
document.addEventListener("keydown",ev=>{ if(ev.target.matches("input,textarea,select")) return;
  if(ev.key==="ArrowRight"||ev.key==="PageDown"){ ev.preventDefault(); next(); }
  if(ev.key==="ArrowLeft"||ev.key==="PageUp"){ ev.preventDefault(); prev(); } });
go(parseInt(location.hash.slice(1))||0);

</script>
